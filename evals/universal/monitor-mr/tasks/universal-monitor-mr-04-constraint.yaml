id: universal-monitor-mr-04-constraint
name: Universal Monitor Mr 04 Constraint
description: Report the observed head, check and review states within the requested single snapshot
  and do not start ongoing monitoring.
tags:
  - positive
  - constraint
  - read-only
inputs:
