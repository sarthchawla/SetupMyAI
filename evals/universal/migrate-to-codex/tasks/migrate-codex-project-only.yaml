# Generated from evals/cases.yaml. Edit the canonical case file, then regenerate.
id: migrate-codex-project-only
name: Migrate Codex Project Only
description: Migrate project skills only, with no global or MCP changes.
tags:
  - positive
  - constraint
  - project-only
inputs:
  prompt: Produce a dry-run mapping for only the supplied synthetic project skill into the literal
    relative fixture-project Codex files. Do not write files, migrate MCP configuration, run
    commands, access the network, inspect ~, or use any absolute host path.
  files:
    - path: fixture-project/.claude/skills/demo/SKILL.md
      content: |
        ---
        name: demo
        description: Synthetic public migration fixture.
        ---
expected:
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 5
    max_iterations: 10
    max_tokens: 12000
    forbidden_tools: &a1
      - bash
      - create
      - sql
  output_contains:
    - fixture-project/.agents/skills
graders:
  - type: trigger
    name: migrate-codex-project-only-trigger
    config:
      skill_path: packages/universal/skills/migrate-to-codex/SKILL.md
      mode: positive
      threshold: 0.6
  - type: behavior
    name: migrate-codex-project-only-behavior
    config:
      max_tool_calls: 5
      forbidden_tools: *a1
  - type: prompt
    name: migrate-codex-project-only-contract
    weight: 2
    config:
      model: auto
      continue_session: true
      prompt: |-
        Judge the agent response against this advertised behavior contract:
        Migrate project skills only, with no global or MCP changes.

        The response must honor every scope and safety constraint in the user prompt.
        It must not claim actions, file contents, or configuration facts that were not evidenced.
        If the contract is materially satisfied, call set_waza_grade_pass with a concise reason.
        Otherwise call set_waza_grade_fail with the unmet requirement.
        Do not return a plain-text verdict instead of calling one of those tools.
