    trigger: negative
    prompt: Write isolated unit tests for a pure calculation function; no acceptance behavior is involved.
    contract: Do not introduce BDD scenarios or feature files for a unit-only task.
  - id: bddtw-04-constraint
    tags:
    - positive
    - constraint
    - no-production-change
    trigger: positive
    prompt: Fix flaky Playwright-BDD acceptance tests using mock data, without changing production behavior.
    modelPrompt: Review the synthetic Playwright-BDD feature and step fixture in this evaluation workspace
      and propose a deterministic mock-data fix. Do not edit src/checkout.ts, access the network, inspect
      ~, or use absolute host paths.
    files:
    - path: src/checkout.ts
      content: 'export const submitOrder = () => fetch("/api/orders");

        '
    - path: features/checkout.feature
      content: "Feature: Checkout\n  Scenario: Submit an order\n    Then the order is accepted\n"
    - path: features/steps/checkout.steps.ts
      content: "Then(\"the order is accepted\", async () => {\n  await expect(page.getByText(\"Accepted\"\
        )).toBeVisible();\n});\n"
    outputContains:
    - mock
    - checkout
    maxToolCalls: 8
    forbiddenTools:
    - bash
    - sql
    contract: Limit changes to BDD tests and mocks while preserving production behavior.
