id: pstack-sharpen-04-constraint
name: Pstack Sharpen 04 Constraint
description: Produce a bounded specification and distinguish required clarification from optional
  implementation choices.
tags:
  - positive
  - constraint
  - read-only
inputs:
  prompt: Sharpen this request with the available facts; label assumptions and do not expand the scope
    into unrelated features. This is a synthetic, response-only evaluation. Use only the supplied
    request context. Do not execute commands, edit files, access the network, read host/private
    paths, or invoke provider, publication, scheduling or model services. Describe proposed actions
    and evidence gaps; do not claim actions or checks occurred.
expected:
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 4
    max_iterations: 10
    max_tokens: 12000
    forbidden_tools: &a1
      - bash
      - create
      - sql
graders:
  - type: trigger
    name: pstack-sharpen-04-constraint-trigger
    config:
      skill_path: packages/pstack/skills/sharpen/SKILL.md
      mode: positive
      threshold: 0.6
  - type: behavior
    name: pstack-sharpen-04-constraint-behavior
    config:
      max_tool_calls: 4
      forbidden_tools: *a1
  - type: prompt
    name: pstack-sharpen-04-constraint-contract
    weight: 2
    config:
      model: auto
      continue_session: true
      prompt: >-
        Judge the agent response against this advertised behavior contract:

        Produce a bounded specification and distinguish required clarification from optional
        implementation choices.


        The response must honor every scope and safety constraint in the user prompt.

        It must not claim actions, file contents, or configuration facts that were not evidenced.

        If the contract is materially satisfied, call set_waza_grade_pass with a concise reason.

        Otherwise call set_waza_grade_fail with the unmet requirement.

        Do not return a plain-text verdict instead of calling one of those tools.
