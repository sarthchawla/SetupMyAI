id: pstack-benchmark-checklist-04-constraint
name: Pstack Benchmark Checklist 04 Constraint
description: Limit conclusions to supplied measurements and explicitly withhold repeatability or
  causal claims that require new runs.
tags:
  - positive
  - constraint
  - read-only
inputs:
