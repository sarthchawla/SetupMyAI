    invoke provider, publication, scheduling or model services. Describe proposed actions and
    evidence gaps; do not claim actions or checks occurred.
expected:
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 4
    max_iterations: 10
    max_tokens: 12000
    forbidden_tools: &a1
      - bash
      - create
      - sql
graders:
  - type: trigger
