# Generated from evals/cases.yaml. Edit the canonical case file, then regenerate.
id: organization-guidance-only
name: Organization Guidance Only
description: Give advice only and make no code or configuration changes.
tags:
  - positive
  - constraint
  - read-only
inputs:
  prompt: Review only the synthetic organization config supplied in this evaluation workspace and
    advise on its Better Auth team and role structure. Do not edit files, access the network,
    inspect ~, or use absolute host paths.
  files:
    - path: auth.ts
      content: |
        export const organizationOptions = {
          teams: { enabled: true },
          roles: ["owner", "admin", "member"],
        };
expected:
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 5
    max_iterations: 10
    max_tokens: 12000
    forbidden_tools: &a1
      - bash
      - create
      - sql
  output_contains:
    - organization
    - role
graders:
  - type: trigger
    name: organization-guidance-only-trigger
    config:
      skill_path: packages/react-frontend/skills/organization-best-practices/SKILL.md
      mode: positive
      threshold: 0.6
  - type: behavior
    name: organization-guidance-only-behavior
    config:
      max_tool_calls: 5
      forbidden_tools: *a1
  - type: prompt
    name: organization-guidance-only-contract
    weight: 2
    config:
      model: auto
      continue_session: true
      prompt: |-
        Judge the agent response against this advertised behavior contract:
        Give advice only and make no code or configuration changes.

        The response must honor every scope and safety constraint in the user prompt.
        It must not claim actions, file contents, or configuration facts that were not evidenced.
        If the contract is materially satisfied, call set_waza_grade_pass with a concise reason.
        Otherwise call set_waza_grade_fail with the unmet requirement.
        Do not return a plain-text verdict instead of calling one of those tools.
