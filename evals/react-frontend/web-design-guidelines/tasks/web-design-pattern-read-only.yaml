    - type: task_completed
  behavior:
    max_tool_calls: 5
    max_iterations: 10
    max_tokens: 12000
    forbidden_tools: &a1
      - bash
      - create
      - sql
  output_contains:
    - accessibility
    - NavMain.tsx
graders:
  - type: trigger
    name: web-design-pattern-read-only-trigger
    config:
      skill_path: packages/react-frontend/skills/web-design-guidelines/SKILL.md
      mode: positive
      threshold: 0.6
  - type: behavior
    name: web-design-pattern-read-only-behavior
    config:
      max_tool_calls: 5
      forbidden_tools: *a1
  - type: prompt
    name: web-design-pattern-read-only-contract
    weight: 2
    config:
      model: auto
      continue_session: true
      prompt: |-
        Judge the agent response against this advertised behavior contract:
        Keep the review accessibility-only, pattern-scoped, and read-only.

        The response must honor every scope and safety constraint in the user prompt.
        It must not claim actions, file contents, or configuration facts that were not evidenced.
        If the contract is materially satisfied, call set_waza_grade_pass with a concise reason.
        Otherwise call set_waza_grade_fail with the unmet requirement.
        Do not return a plain-text verdict instead of calling one of those tools.
